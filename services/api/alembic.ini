# =============================================================================
# Alembic Database Migrations Configuration
# =============================================================================
# 
# Commands:
#   alembic revision --autogenerate -m "description"  # Create migration
#   alembic upgrade head                              # Apply all migrations
#   alembic downgrade -1                              # Rollback last migration
#   alembic history                                   # Show migration history
#   alembic current                                   # Show current revision
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# SQLAlchemy URL (overridden at runtime from .env)
sqlalchemy.url = sqlite+aiosqlite:///./stairdoc.db

[post_write_hooks]
# Run black formatter on generated files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
